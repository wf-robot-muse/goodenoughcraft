name: GoodEnoughCraft CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN: ${{ github.workspace }}/Godot_v4.7.2-stable_linux.x86_64

jobs:
  validate-and-export:
    name: Validate and export
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for the Android export)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot editor and export templates
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          chmod +x "$GODOT_BIN"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          # The .tpz nests everything under templates/; Godot expects it flat.
          mv "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          "$GODOT_BIN" --version

      - name: Set up Android SDK components and Godot editor settings
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          mkdir -p "$HOME/.local/share/godot/keystores"
          keytool -genkeypair -keystore "$HOME/.local/share/godot/keystores/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          # Generate a default editor settings file, then point it at this
          # runner's JDK and Android SDK (headless exports read these paths
          # from the settings file, not from environment variables).
          "$GODOT_BIN" --headless --editor --quit --path . > /dev/null 2>&1 || true
          SETTINGS="$HOME/.config/godot/editor_settings-4.7.tres"
          sed -i "s|^export/android/java_sdk_path = .*|export/android/java_sdk_path = \"$JAVA_HOME\"|" "$SETTINGS"
          sed -i "s|^export/android/android_sdk_path = .*|export/android/android_sdk_path = \"$ANDROID_HOME\"|" "$SETTINGS"
          grep "export/android" "$SETTINGS"

      # Android release signing uses one fixed keystore, stored as repo
      # secrets, so every build carries the same signature and new builds
      # install over old ones (required on Fire OS / Android devices).
      # Godot reads the release keystore from the export preset, so this
      # step decodes the keystore and points the preset at it.
      - name: Prepare Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$HOME/.local/share/godot/keystores"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/.local/share/godot/keystores/release.keystore"
          sed -i "s|^keystore/release=.*|keystore/release=\"$HOME/.local/share/godot/keystores/release.keystore\"|" export_presets.cfg
          sed -i "s|^keystore/release_user=.*|keystore/release_user=\"$ANDROID_KEY_ALIAS\"|" export_presets.cfg
          sed -i "s|^keystore/release_password=.*|keystore/release_password=\"$ANDROID_KEY_PASSWORD\"|" export_presets.cfg

      - name: Import project (loads the Voxel Tools extension)
        run: |
          "$GODOT_BIN" --headless --import --path .

      - name: Voxel smoke test
        run: timeout 120 "$GODOT_BIN" --headless --path . res://scenes/smoke_test.tscn

      - name: Export Windows
        run: |
          mkdir -p build/windows
          "$GODOT_BIN" --headless --export-release "Windows Desktop" build/windows/GoodEnoughCraft.exe

      # Windows releases are Authenticode-signed with the project owner's
      # self-signed code-signing certificate (see CODE_SIGNING_POLICY.md
      # for the published certificate fingerprint and what this signature
      # does and does not guarantee). The PFX lives in repo secrets,
      # mirroring the Android keystore setup. osslsigncode applies the
      # signature from this Linux runner; the RFC 3161 timestamp keeps
      # signatures verifiable after the certificate expires. The build
      # fails if the signature is absent or the signer's fingerprint
      # does not match the published one.
      - name: Sign Windows executable (self-signed certificate)
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          EXPECTED_FINGERPRINT: "AF:FA:FC:91:08:15:72:F0:81:C9:F0:78:3A:59:59:5E:61:F4:BE:00:D8:F3:77:CA:55:82:DD:3D:52:CE:62:B3"
        run: |
          if [ -z "$WINDOWS_CERT_BASE64" ]; then
            echo "::error::WINDOWS_CERT_BASE64 secret is not set"
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode
          echo "$WINDOWS_CERT_BASE64" | base64 -d > "$RUNNER_TEMP/windows-cert.pfx"
          osslsigncode sign \
            -pkcs12 "$RUNNER_TEMP/windows-cert.pfx" \
            -pass "$WINDOWS_CERT_PASSWORD" \
            -n "GoodEnoughCraft" \
            -i "https://github.com/wf-robot-muse/goodenoughcraft" \
            -ts "http://timestamp.digicert.com" \
            -h sha256 \
            -in build/windows/GoodEnoughCraft.exe \
            -out build/windows/GoodEnoughCraft-signed.exe
          mv build/windows/GoodEnoughCraft-signed.exe build/windows/GoodEnoughCraft.exe
          openssl pkcs12 -in "$RUNNER_TEMP/windows-cert.pfx" -passin "pass:$WINDOWS_CERT_PASSWORD" -nokeys -clcerts -out "$RUNNER_TEMP/windows-cert.pem"
          osslsigncode extract-signature -in build/windows/GoodEnoughCraft.exe -out "$RUNNER_TEMP/signature.p7"
          openssl pkcs7 -inform DER -in "$RUNNER_TEMP/signature.p7" -print_certs -out "$RUNNER_TEMP/signer.pem"
          ACTUAL_FINGERPRINT="$(openssl x509 -in "$RUNNER_TEMP/signer.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          echo "Signer SHA-256 fingerprint: $ACTUAL_FINGERPRINT"
          if [ "$ACTUAL_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "::error::Signer fingerprint does not match the published fingerprint"
            exit 1
          fi
          osslsigncode verify -in build/windows/GoodEnoughCraft.exe -CAfile "$RUNNER_TEMP/windows-cert.pem"
          rm -f "$RUNNER_TEMP/windows-cert.pfx"

      - name: Export Linux
        run: |
          mkdir -p build/linux
          "$GODOT_BIN" --headless --export-release "Linux" build/linux/GoodEnoughCraft.x86_64

      - name: Export macOS
        run: |
          mkdir -p build/macos
          "$GODOT_BIN" --headless --export-release "macOS" build/macos/GoodEnoughCraft.zip

      - name: Export Android (release APK, signed)
        run: |
          mkdir -p build/android
          "$GODOT_BIN" --headless --export-release "Android" build/android/GoodEnoughCraft.apk

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: goodenoughcraft-windows
          path: build/windows/
          if-no-files-found: error

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: goodenoughcraft-linux
          path: build/linux/
          if-no-files-found: error

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: goodenoughcraft-macos
          path: build/macos/
          if-no-files-found: error

      - name: Upload Android build
        uses: actions/upload-artifact@v4
        with:
          name: goodenoughcraft-android
          path: build/android/*.apk
          if-no-files-found: error
